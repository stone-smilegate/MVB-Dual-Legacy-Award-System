<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVB: Dual Legacy Award System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow-x: hidden;
            /* 페이지 최하단 여백 완전 제거 */
            padding-bottom: 0;
        }

        /* 헤더: 첫 번째 영상 이후 등장 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            padding: 25px 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        header.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .header-inner { width: 80%; display: flex; align-items: center; }
        .header-logo {
            /* 1. 브라우저 너비(vw)에 비례하게 설정 (예: 화면 너비의 1.5%) */
            height: 2vw; 
            
            /* 2. 너무 작아지거나 커지는 것을 방지하는 가이드라인 */
            min-height: 30px; /* 모바일 등 작은 화면에서의 최소 크기 */
            max-height: 45px; /* 큰 화면에서의 최대 크기 제한 */
            
            width: auto;
            display: block;
            transition: all 0.3s ease; /* 크기 변경 시 부드럽게 반응 */
        }

        /* 모바일 화면(768px 이하)에서 로고가 너무 작을 경우를 대비한 조정 */
        @media (max-width: 768px) {
            .header-logo {
                height: 22px; /* 모바일에서는 고정 크기로 가독성 확보 */
            }
        }

        /* 첫 번째 영상 (Full Width) */
        .hero-section { width: 100%; position: relative; background: #000; }
        .aspect-ratio-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            overflow: hidden;
        }
        .aspect-ratio-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* 바디 컨텐츠 (80% Width) */
        .content-container {
            width: 80%;
            margin: 0 auto;
            /* 상단 여백은 유지, 하단 여백은 제거 */
            padding: 80px 0 0 0; 
        }

        /* 마지막 섹션의 아래 여백을 0으로 만들어 페이지 끝에 밀착 */
        section { 
            width: 100%; 
            margin-bottom: 100px; 
            line-height: 0; /* 이미지 하단 미세 공백 제거 */
        }
        
        section:last-child {
            margin-bottom: 0;
        }

        .image-box img { 
            width: 100%; 
            height: auto; 
            display: block; 
        }

    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-inner">
            <img src="logo_top.png" alt="Header Logo" class="header-logo">
        </div>
    </header>

    <!-- 맨 위 영상 -->
    <div id="trigger-point" class="hero-section">
        <div class="aspect-ratio-box">
            <iframe src="https://player.vimeo.com/video/1190321204?background=1&autoplay=1&loop=1&byline=0&title=0" allow="autoplay; fullscreen"></iframe>
        </div>
    </div>

    <!-- 컨텐츠 컨테이너 -->
    <div class="content-container">
        <section class="image-box">
            <img src="photo1.jpg" alt="Award System 1">
        </section>

        <section class="aspect-ratio-box">
            <iframe src="https://player.vimeo.com/video/1190321401?background=1&autoplay=1&loop=1&byline=0&title=0" allow="autoplay; fullscreen"></iframe>
        </section>

        <!-- 마지막 이미지: 여기서 페이지가 끝남 -->
        <section class="image-box">
            <img src="photo2.jpg" alt="Award System 2">
        </section>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const header = document.getElementById('main-header');
            const trigger = document.getElementById('trigger-point');

            const handleScroll = () => {
                const rect = trigger.getBoundingClientRect();
                // 첫 영상 하단이 브라우저 상단에 닿으면 헤더 활성화
                if (rect.bottom <= 10) {
                    header.classList.add('active');
                } else {
                    header.classList.remove('active');
                }
            };

            window.addEventListener('scroll', handleScroll);
            window.addEventListener('resize', handleScroll);
        });
    </script>
</body>
</html>
